global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['100.70.241.87:8000']

  - job_name: 'image-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['100.70.241.87:8001']
