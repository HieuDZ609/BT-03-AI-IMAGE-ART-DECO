groups:
  - name: bt03-alerts
    rules:
      - alert: GatewayDown
        expr: up{job="gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Gateway is down"
          description: "Gateway tại 100.111.232.74:8000 không phản hồi"

      - alert: ImageServiceDown
        expr: up{job="image-service"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Image Service is down"