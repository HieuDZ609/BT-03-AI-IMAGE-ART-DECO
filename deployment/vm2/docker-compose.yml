# docker-compose.yml - B4.2 Image Storage & AI Worker 2.1
# Chạy tại: deployment/vm2/ trên máy ảo Ubuntu VM2
version: '3.8'

services:
  b4-2-image-storage:
    build:
      context: ../../image-service
      dockerfile: Dockerfile
    container_name: b4-2-storage
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - NODE_ENV=production
      - HOST_IP=${HOST_IP:-192.168.100.12}
      - BASE_URL=${BASE_URL:-http://192.168.100.12:8002}
      # Redis Hợp đồng nhóm B4 (Core node VM4 - Tailscale: 100.111.232.74:6379)
      - REDIS_HOST=${REDIS_HOST:-100.111.232.74}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-B4Deco_Redis_2026!}
      - REDIS_URL=${REDIS_URL:-redis://:B4Deco_Redis_2026!@100.111.232.74:6379/0}
    volumes:
      - ../../image-service/storage:/app/storage
      - ../../image-service/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8002/api/v1/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - b4-network

networks:
  b4-network:
    driver: bridge
